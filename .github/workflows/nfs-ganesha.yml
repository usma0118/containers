---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "NFS-Ganesha"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NFS-Ganesha version to build (optional)"
        required: false
        type: string

  push:
    branches: ["main"]
    paths:
      - "nfs-ganesha/**"
      - ".github/workflows/nfs-ganesha.yml"

  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nfs-ganesha
  UPSTREAM_REPO: nfs-ganesha/nfs-ganesha
  WOLFI_IMAGE: cgr.dev/chainguard/wolfi-base:latest

jobs:
  check-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      wolfi-version: ${{ steps.wolfi.outputs.version }}
      should-build: ${{ steps.decision.outputs.should-build }}

    steps:
      - name: Determine upstream release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="${REQUESTED_VERSION#v}"
          else
            VERSION="$(
              curl -fsSL \
                "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
            )"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Unable to determine upstream Ganesha release"
            exit 1
          fi

          echo "Upstream Ganesha version: ${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Query Wolfi Ganesha package
        id: wolfi
        run: |
          set -euo pipefail

          WOLFI_VERSION="$(
            docker run --rm \
              "${WOLFI_IMAGE}" \
              sh -c '
                apk update >/dev/null
                apk policy nfs-ganesha |
                  awk "/^nfs-ganesha-[0-9]/{print \$1; exit}" |
                  sed "s/^nfs-ganesha-//"
              '
          )"

          if [ -z "$WOLFI_VERSION" ]; then
            echo "Unable to determine Wolfi nfs-ganesha version"
            exit 1
          fi

          WOLFI_RELEASE="${WOLFI_VERSION%-r*}"

          echo "Wolfi package: ${WOLFI_VERSION}"
          echo "Wolfi Ganesha release: ${WOLFI_RELEASE}"

          echo "version=${WOLFI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${WOLFI_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        env:
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
          WOLFI_RELEASE: ${{ steps.wolfi.outputs.release }}
        run: |
          set -euo pipefail

          if [ "$WOLFI_RELEASE" = "$UPSTREAM_VERSION" ]; then
            echo "Versions match: ${UPSTREAM_VERSION}"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream: ${UPSTREAM_VERSION}"
            echo "Wolfi:    ${WOLFI_RELEASE}"
            echo "Wolfi has not caught up yet."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release

    if: needs.check-release.outputs.should-build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-release.outputs.version }}
            type=raw,value=${{ needs.check-release.outputs.major }}
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:nfs-ganesha"
          sbom: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true
