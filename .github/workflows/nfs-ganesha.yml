---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "NFS-Ganesha"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "NFS-Ganesha version to build"
        required: false
        type: string

  push:
    branches: ["main"]
    paths:
      - "nfs-ganesha/**"
      - ".github/workflows/nfs-ganesha.yml"

  schedule:
    # Check upstream releases every day.
    - cron: "17 5 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nfs-ganesha
  UPSTREAM_REPO: nfs-ganesha/nfs-ganesha

jobs:
  check-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.release.outputs.version }}
      should-build: ${{ steps.release.outputs.should-build }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine upstream release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="${REQUESTED_VERSION#v}"
          else
            VERSION="$(
              curl -fsSL \
                "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" |
              jq -r '.tag_name' |
              sed 's/^v//'
            )"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Unable to determine upstream release"
            exit 1
          fi

          echo "Upstream Ganesha release: $VERSION"

          if git rev-parse "refs/tags/ganesha-v${VERSION}" >/dev/null 2>&1; then
            echo "ganesha-v${VERSION} already built"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Ganesha release detected"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release marker
        if: steps.release.outputs.should-build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git tag "ganesha-v${VERSION}"
          git push origin "ganesha-v${VERSION}"

  build:
    needs: check-release

    if: needs.check-release.outputs.should-build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-release.outputs.version }}
            type=raw,value=${{ needs.check-release.outputs.version_major }}
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:nfs-ganesha"
          sbom: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true
